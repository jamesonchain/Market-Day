<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #141631; }
      body { font-family: Inter, Arial, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      [data-composition-src] { position: absolute; inset: 0; }
      .scene-host { pointer-events: none; }
      .daily-sky { position: absolute; inset: 0; background: linear-gradient(180deg, #141631 0%, #4B3A7A 38%, #E8718D 73%, #FFB38A 100%); }
      .daily-cloud { position: absolute; width: 330px; height: 78px; border-radius: 100px; background: rgba(255,246,234,.16); filter: blur(14px); z-index: 1; }
      .daily-cloud:before, .daily-cloud:after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
      .daily-cloud:before { width: 130px; height: 130px; left: 62px; bottom: 12px; }
      .daily-cloud:after { width: 180px; height: 180px; right: 28px; bottom: 4px; }
      .daily-cloud-a { top: 25%; left: -8%; }
      .daily-cloud-b { top: 43%; right: -12%; transform: scale(.72); opacity: .55; }
    </style>
  </head>
  <body>
    <main id="root" data-composition-id="main" data-start="0" data-duration="33.192" data-width="1080" data-height="1350">
      <div id="daily-sky" class="daily-sky"></div><div id="daily-cloud-a" class="daily-cloud daily-cloud-a"></div><div id="daily-cloud-b" class="daily-cloud daily-cloud-b"></div>
      <audio id="daily-music-bed" class="clip" data-start="0" data-duration="33.192" data-track-index="20" src="assets/audio/ambient-bed.wav" data-volume="0.1" data-fade-in="0.4" data-fade-out="1.5" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0,"v":0.9},{"t":0.2,"v":0.32},{"t":18.286,"v":0.32},{"t":18.886,"v":0.9},{"t":19.386,"v":0.9},{"t":19.586,"v":0.32},{"t":24.271,"v":0.32},{"t":24.871,"v":0.9},{"t":25.371,"v":0.9},{"t":25.571,"v":0.32},{"t":29.592,"v":0.32},{"t":30.192,"v":0.9},{"t":33.192,"v":0}]}]}'></audio>
      <div id="day-intro" class="scene-host" data-composition-id="day-intro" data-composition-src="compositions/day-intro.html" data-start="0" data-duration="14.451" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="lower-third" class="scene-host" data-composition-id="lower-third" data-composition-src="compositions/lower-third.html" data-start="13.451" data-duration="5.935" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="stat-card" class="scene-host" data-composition-id="stat-card" data-composition-src="compositions/stat-card.html" data-start="18.886" data-duration="6.485" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="blocked-moment" class="scene-host" data-composition-id="blocked-moment" data-composition-src="compositions/blocked-moment.html" data-start="24.871" data-duration="5.821" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="daily-ending" class="scene-host" data-composition-id="daily-ending" data-composition-src="compositions/daily-ending.html" data-start="30.192" data-duration="3" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#daily-cloud-a", { x: -80, opacity: 0 }, { x: 140, opacity: .44, duration: 1, ease: "none" }, 0);
      tl.fromTo("#daily-cloud-b", { x: 100, opacity: 0 }, { x: -160, opacity: .3, duration: 1, ease: "none" }, 0);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
